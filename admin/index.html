<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperYes · Painel operacional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div id="loginView" class="login">
    <form class="login-card" onsubmit="return doLogin(event)">
      <div class="brand">SuperYes</div>
      <h1>Painel operacional</h1>
      <p>Auditoria de leads, selfies e PIX da operação de crédito.</p>
      <label>Usuário</label>
      <input id="user" autocomplete="username" value="admin">
      <label>Senha</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn" id="loginBtn" type="submit">Entrar no painel</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <div id="appView" class="hidden">
    <div class="shell">
      <aside class="side">
        <div>
          <div class="brand">SuperYes</div>
          <p>Crédito · operação</p>
        </div>
        <nav>
          <a class="on" href="/admin">Dashboard</a>
          <a href="/api/admin/export.csv">Exportar CSV</a>
          <button class="link" onclick="logout()">Sair</button>
        </nav>
      </aside>
      <main class="main">
        <h1>Métricas de conversão</h1>
        <p style="color:#6B6280;margin-top:4px">Solicitações, aprovação de crédito e volume de PIX.</p>
        <div class="kpis" id="kpis"></div>
        <div class="funnel">
          <div class="box">
            <strong>Funil</strong>
            <div id="funnelBars"></div>
          </div>
          <div class="box" id="statusBox"></div>
        </div>
        <div id="listView">
          <div class="toolbar">
            <input id="search" placeholder="Buscar nome, CPF, e-mail, PIX..." oninput="loadLeads()">
          </div>
          <div id="tableWrap"></div>
        </div>
        <div id="detailView" class="hidden detail"></div>
      </main>
    </div>
  </div>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
