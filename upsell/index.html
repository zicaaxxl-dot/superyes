<script>
(function () {
  if (!window.ttq) return;
  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function syncIdentify() {
    const email = localStorage.getItem('email');
    const phoneRaw = localStorage.getItem('telephone') || localStorage.getItem('telefone');
    const cpf = localStorage.getItem('cpf');
    const identify = {};
    if (email) identify.email = await sha256Hex(email.trim().toLowerCase());
    if (phoneRaw) {
      const digits = phoneRaw.replace(/\D/g, '');
      const e164 = '+' + (digits.startsWith('55') ? digits : '55' + digits);
      identify.phone_number = await sha256Hex(e164);
    }
    if (cpf) identify.external_id = await sha256Hex(cpf.replace(/\D/g, ''));
    if (Object.keys(identify).length) ttq.identify(identify);
  }
  syncIdentify();
})();

        function getParam(keys) {
            const urlParams = new URLSearchParams(window.location.search);

        const FALLBACK_FIRST_NAMES = ['Maria', 'José', 'Ana', 'João', 'Carlos', 'Paulo', 'Pedro', 'Lucas', 'Marcos', 'Rafael'];
        const FALLBACK_LAST_NAMES = ['Silva', 'Souza', 'Oliveira', 'Santos', 'Pereira', 'Costa', 'Rodrigues', 'Almeida'];
        const FALLBACK_DDDS = ['11', '21', '31', '41', '51', '61', '71', '81', '85'];

        function generateFallbackName() {
            const first = FALLBACK_FIRST_NAMES[Math.floor(Math.random() * FALLBACK_FIRST_NAMES.length)];
            const last = FALLBACK_LAST_NAMES[Math.floor(Math.random() * FALLBACK_LAST_NAMES.length)];
            return `${first} ${last}`;
        }

        function generateFallbackEmail(name) {
            const slug = name.toLowerCase().normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '').replace(/[^a-z]+/g, '.');
            return `${slug}${Math.floor(1000 + Math.random() * 9000)}@gmail.com`;
        }

        function generateFallbackPhone() {
            const ddd = FALLBACK_DDDS[Math.floor(Math.random() * FALLBACK_DDDS.length)];
            const number = '9' + String(Math.floor(10000000 + Math.random() * 89999999));
            return ddd + number;
        }

        function generateFallbackDocument() {
            const calcDigit = (digits) => {
                let sum = 0;
                let weight = digits.length + 1;
                for (const d of digits) { sum += d * weight; weight--; }
                const mod = sum % 11;
                return mod < 2 ? 0 : 11 - mod;
            };
            const base = Array.from({ length: 9 }, () => Math.floor(Math.random() * 9));
            const d1 = calcDigit(base);
            const d2 = calcDigit([...base, d1]);
            return [...base, d1, d2].join('');
        }

        function collectCustomerData() {
            const name = getParam(['nome', 'name']) || generateFallbackName();

            const phone = getParam(['telefone', 'telephone', 'phone']) || generateFallbackPhone();

                    <div class="mt-6 w-full shrink-0 relative z-20">
                        <button id="btn-principal" onclick="handleBotaoPrincipal('${data.id}')"
                            class="w-full bg-brandDark hover:bg-[#1A2C45] text-white font-bold py-4 px-4 rounded-xl shadow-[0_8px_20px_-8px_rgba(14,26,43,0.5)] transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-[15px] relative overflow-hidden group">
                            <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-[100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></span>
                            <span class="relative flex items-center gap-2">${data.botao} <i data-lucide="chevron-right" class="w-4 h-4 opacity-70 group-hover:translate-x-1 transition-transform"></i></span>
                        </button>
                        <div id="area-pix" class="hidden w-full"></div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function handleBotaoPrincipal(cenarioId) {
            const data = FUNIL[cenarioId];
            if (data.link) {
                window.location.href = data.link;
                return;
            }
            gerarCobranca(cenarioId);
        }

        async function gerarCobranca(cenarioId) {
            const btn = document.getElementById('btn-principal');
            const areaPix = document.getElementById('area-pix');

            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span class="animate-pulse">Conectando ao Gateway...</span>`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            lucide.createIcons();

            try {
                // Se já existe um PIX gerado e ainda não pago pra esse cenário,
                // reaproveita ele em vez de gerar outro (evita gerar PIX
                // infinitamente a cada tentativa).
                const pendingKey = 'pix_pending_upsell-' + cenarioId;
                const pendingRaw = localStorage.getItem(pendingKey);
                if (pendingRaw) {
                    try {
                        const pending = JSON.parse(pendingRaw);
                        const isFresh = pending.id && (Date.now() - pending.ts) < PIX_PENDING_MAX_AGE_MS;
                        if (isFresh) {
                            const statusRes = await fetch(`${PIX_API_BASE}/api/pix/status?id=${encodeURIComponent(pending.id)}`);
                            const statusData = await statusRes.json();
                            if (statusData.status === 'pending' && statusData.qrCode) {
                                currentTxId = pending.id;
                                exibirLayoutPix(statusData.qrCode, cenarioId);
                                return;
                            }
                        }
                    } catch (e) {}
                    localStorage.removeItem(pendingKey);
                }

                const customer = collectCustomerData();
                const urlParams = new URLSearchParams(window.location.search);
                const tracking = {
                    utm_source: urlParams.get('utm_source') || '',
                    utm_medium: urlParams.get('utm_medium') || '',
                    utm_campaign: urlParams.get('utm_campaign') || '',
                    utm_content: urlParams.get('utm_content') || '',
                    utm_term: urlParams.get('utm_term') || '',
                    src: urlParams.get('src') || '',
                    sck: urlParams.get('sck') || '',
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                let response;
                try {
                    response = await fetch(`${PIX_API_BASE}/api/pix/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ ...customer, product: 'upsell-' + cenarioId, tracking }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                } catch(fetchError) {
                    if (fetchError.name === 'AbortError') throw new Error("Tempo limite de conexão excedido.");
                    throw new Error(`Erro de conexão com o servidor de pagamentos.`);
                }

                const rawText = await response.text();
                let result;
                try { result = JSON.parse(rawText); }
                catch(e) { throw new Error(`O gateway retornou uma resposta inválida.`); }

                if (!response.ok) {
                    throw new Error(result.error || "Transação não autorizada momentaneamente.");
                }

                if (result.qrCode) {
                    currentTxId = result.transactionId || null;
                    if (currentTxId) localStorage.setItem(pendingKey, JSON.stringify({ id: currentTxId, ts: Date.now() }));
                    exibirLayoutPix(result.qrCode, cenarioId);
                } else {
                    throw new Error("Dados de pagamento não recebidos do gateway.");
                }

            } catch (error) {
                btn.classList.add('hidden');
                areaPix.classList.remove('hidden');
                areaPix.classList.add('fade-in', 'mt-4');
                areaPix.innerHTML = `
                    <div class="p-5 bg-red-50 border border-red-100 rounded-2xl text-left shadow-sm relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-red-100 opacity-50"><i data-lucide="alert-octagon" class="w-24 h-24"></i></div>
                        <div class="flex items-center gap-3 text-red-800 mb-3 relative z-10">
                            <div class="p-2 bg-red-100 rounded-full"><i data-lucide="wifi-off" class="w-5 h-5"></i></div>
                            <h4 class="font-bold text-[15px]">Falha na Comunicação</h4>
                        </div>
                        <p class="text-[13px] text-red-700 font-medium leading-relaxed relative z-10 mb-4">${error.message}</p>
                        <button onclick="window.location.reload()" class="relative z-10 w-full bg-red-100 hover:bg-red-200 text-red-800 font-bold py-3 rounded-xl text-sm transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="rotate-cw" class="w-4 h-4"></i> TENTAR NOVAMENTE
                        </button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function exibirLayoutPix(codigoCopia, cenarioId) {
            const btn = document.getElementById('btn-principal');
            const areaPix = document.getElementById('area-pix');

            btn.classList.add('hidden');
            areaPix.classList.remove('hidden');
            areaPix.classList.add('fade-in');

            areaPix.innerHTML = `
                <div class="border-t border-gray-100/80 pt-6 mt-2 flex flex-col items-center w-full text-center">
                    <p class="text-[14px] font-bold text-gray-900 mb-4">Copie o código PIX abaixo e pague no app do seu banco:</p>

                    <div class="w-full mb-4 relative group">
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 group-hover:text-brandDark transition-colors">
                            <i data-lucide="clipboard-copy" class="w-5 h-5"></i>
                        </div>
                        <input type="text" value="${codigoCopia}" readonly class="w-full bg-gray-50 border border-gray-200 text-gray-600 text-[11px] rounded-xl pl-4 pr-10 py-4 font-mono truncate focus:outline-none focus:border-brandDark transition-all cursor-pointer shadow-sm hover:bg-gray-100" onclick="this.select(); document.execCommand('copy'); dispararFeedbackCopia();">
                    </div>
                    
                    <button onclick="copiarCodigoPix('${codigoCopia}')" id="btn-copiar"
                        class="w-full bg-brandDark hover:bg-[#1A2C45] text-white font-bold py-4 rounded-xl shadow-[0_8px_20px_-8px_rgba(14,26,43,0.5)] transition-all active:scale-[0.98] flex items-center justify-center gap-2 mb-6 text-[15px]">
                        <i data-lucide="copy" class="w-5 h-5"></i> COPIAR CÓDIGO PIX
                    </button>

                    <div class="w-full bg-emerald-50/80 border border-emerald-200 rounded-2xl p-5 flex flex-col items-center text-center shadow-sm relative overflow-hidden">
                         <div class="absolute inset-0 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:16px_16px] opacity-[0.15]"></div>
                        <div class="flex items-center gap-2.5 mb-3 relative z-10">
                            <div class="relative flex h-4 w-4 items-center justify-center">
                              <span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-emerald-500 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-600"></span>
                            </div>
                            <h4 class="text-[13px] text-emerald-800 font-bold uppercase tracking-wide">Aguardando Confirmação</h4>
                        </div>
                        <p class="text-[12px] text-emerald-700 mb-5 font-medium leading-relaxed px-2 relative z-10">
                            O sistema detectará seu pagamento automaticamente. Caso prefira, clique abaixo após pagar.
                        </p>
                        <button onclick="verificarPagamentoManual('${cenarioId}')" id="btn-verificar"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-[14px] relative z-10">
                            <i data-lucide="check-circle-2" class="w-5 h-5 text-white/90"></i> JÁ REALIZEI O PAGAMENTO
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
            
            if (currentTxId) {
                iniciarPollingPagamento(currentTxId, cenarioId);
            }
        }

        function copiarCodigoPix(texto) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(texto)
                    .then(dispararFeedbackCopia)
                    .catch(() => usarFallbackCopia(texto));
            } else {
                usarFallbackCopia(texto);
            }
        }

        function usarFallbackCopia(texto) {
             const textArea = document.createElement("textarea");
             textArea.value = texto;
             textArea.style.position = "fixed"; 
             textArea.style.top = "0"; 
             textArea.style.left = "0";
             textArea.style.opacity = "0"; 
             document.body.appendChild(textArea);
             textArea.focus();
             textArea.select();
             try {
                 const successful = document.execCommand('copy');
                 if(successful) dispararFeedbackCopia();
             } catch (err) {
                 showToast("Não foi possível copiar automaticamente. Selecione e copie manualmente.", "error");
             }
             document.body.removeChild(textArea);
        }

        function dispararFeedbackCopia() {
            const btn = document.getElementById('btn-copiar');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-5 h-5 text-emerald-400 scale-125 transition-transform"></i> CÓDIGO COPIADO!`;
            btn.classList.remove('bg-brandDark', 'hover:bg-[#1A2C45]');
            btn.classList.add('bg-emerald-600', 'pointer-events-none');
            lucide.createIcons();
            showToast("Código PIX copiado para a área de transferência!", "success");
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-emerald-600', 'pointer-events-none');
                btn.classList.add('bg-brandDark', 'hover:bg-[#1A2C45]');
                lucide.createIcons();
            }, 3500);
        }

        async function checarStatusPagamento(txId) {
            if (!txId) return false;
            try {
                const res = await fetch(`${PIX_API_BASE}/api/pix/status?id=${encodeURIComponent(txId)}`);
                if (!res.ok) return false;
                const data = await res.json();
                return data.status === 'approved';
            } catch(e) {
                return false;
            }
        }

        function iniciarPollingPagamento(txId, cenarioId) {
            if(pollingInterval) clearInterval(pollingInterval);
            let tentativas = 0;
            pollingInterval = setInterval(async () => {
                tentativas++;
                const isPaid = await checarStatusPagamento(txId);
                if(isPaid) {
                    clearInterval(pollingInterval);
                    localStorage.removeItem('pix_pending_upsell-' + cenarioId);
                    showToast("Pagamento confirmado! Processando...", "success");
                    avancarCenario(cenarioId);
                }
                if(tentativas > 40) clearInterval(pollingInterval);
            }, 3000);
        }

        async function verificarPagamentoManual(cenarioId) {
            const btn = document.getElementById('btn-verificar');
            const originalHtml = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Validando com o Banco...`;
            btn.classList.add('opacity-90', 'pointer-events-none');
            lucide.createIcons();
            
            await new Promise(r => setTimeout(r, 1500));

            const isPaid = await checarStatusPagamento(currentTxId);
            
            if(isPaid) {
                if(pollingInterval) clearInterval(pollingInterval);
                localStorage.removeItem('pix_pending_upsell-' + cenarioId);
                showToast("Confirmação recebida com sucesso!", "success");
                avancarCenario(cenarioId);
            } else {
                showToast("Ainda não identificamos seu pagamento. Aguarde alguns segundos e tente novamente.", "error");
                btn.innerHTML = originalHtml;
                btn.classList.remove('opacity-90', 'pointer-events-none');
                lucide.createIcons();
            }
        }

        function avancarCenario(cenarioId) {
            const data = FUNIL[cenarioId];
            if(data.proximoCenario === 'sucesso') telaSucessoAbsoluto();
            else telaCarregamentoIntermediaria(data.proximoCenario);
        }

        function telaCarregamentoIntermediaria(proximoCenario) {
            const contentDiv = document.getElementById('app-content');
            contentDiv.classList.remove('p-6');
            
            contentDiv.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center fade-in p-10 relative overflow-hidden">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(16,185,129,0.05)_0%,transparent_70%)]"></div>
                    <div class="relative mb-8">
                        <div class="absolute inset-0 bg-emerald-100 rounded-full animate-ping opacity-50"></div>
                        <div class="w-20 h-20 bg-emerald-50 border-[3px] border-emerald-400 rounded-full flex items-center justify-center shadow-sm relative z-10">
                            <i data-lucide="check-big" class="w-10 h-10 text-emerald-600 animate-[scale-in_0.3s_ease-out]"></i>
                        </div>
                    </div>
                    <h3 class="text-xl font-black text-gray-900 mb-2 tracking-tight">Pagamento Reconhecido!</h3>
                    <p class="text-gray-600 font-medium text-[15px] mb-8 leading-relaxed">Aguarde enquanto autenticamos a transação nos servidores...</p>
                    <div class="w-full max-w-[240px] bg-gray-100 rounded-full h-2 overflow-hidden relative shadow-inner">
                        <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-emerald-400 to-brandDark animate-[progress-indet_1.5s_ease-in-out_infinite]" style="width: 50%;"></div>
                    </div>
                    <p id="system-log" class="text-[12px] text-gray-400 font-mono mt-5 uppercase tracking-widest font-bold flex items-center gap-2">
                        <i data-lucide="cpu" class="w-4 h-4 animate-spin-slow"></i> Sincronizando Sistema...
                    </p>
                </div>
            `;
            lucide.createIcons();

            setTimeout(() => {
                const log = document.getElementById('system-log');
                if(log) {
                    log.innerHTML = `<i data-lucide="search-check" class="w-4 h-4 text-amber-500"></i> Identificando Próxima Etapa...`;
                    log.classList.replace('text-gray-400', 'text-amber-600');
                    lucide.createIcons();
                }
            }, 2500);

            setTimeout(() => {
                try { window.history.replaceState({}, '', '?step=' + proximoCenario); } catch(e) { }
                contentDiv.classList.add('p-6');
                renderizarTela(proximoCenario);
            }, 5000);
        }

        function telaSucessoAbsoluto() {
            const contentDiv = document.getElementById('app-content');
            contentDiv.classList.remove('p-6');

            contentDiv.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center fade-in p-8 relative overflow-hidden">
                     <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(16,185,129,0.1)_0%,transparent_60%)]"></div>
                     <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 via-emerald-500 to-emerald-400"></div>

                    <div class="mb-6 relative">
                        <div class="absolute inset-0 bg-emerald-100/50 rounded-full animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
                        <div class="w-24 h-24 bg-gradient-to-br from-emerald-50 to-white border-4 border-emerald-500 rounded-full flex items-center justify-center shadow-xl relative z-10">
                            <i data-lucide="unlock-keyhole" class="w-12 h-12 text-emerald-600 drop-shadow-sm"></i>
                        </div>
                    </div>
                    
                    <h2 class="text-[28px] font-black text-gray-900 uppercase tracking-tighter mb-3 leading-none">Acesso Liberado</h2>
                    <p class="text-gray-600 text-[16px] font-medium leading-relaxed mb-10 px-4 max-w-sm mx-auto">Parabéns! Todas as pendências foram regularizadas com sucesso.</p>
                    
                    <div class="w-full bg-white border border-gray-100 rounded-3xl p-6 text-left shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-5"><i data-lucide="shield-check" class="w-32 h-32 text-emerald-900"></i></div>
                        <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100 relative z-10">
                            <div class="p-2 bg-emerald-100 rounded-full">
                                <i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-600"></i>
                            </div>
                            <span class="text-[14px] font-bold text-gray-900 uppercase tracking-wide">Status: 100% Regularizado</span>
                        </div>
                        <div class="font-mono text-[13px] text-gray-500 space-y-3 relative z-10 mb-6 pl-2">
                            <p class="flex items-center justify-between"><strong class="text-gray-700 uppercase tracking-wider font-sans text-[11px]">Protocolo:</strong> <span>${protocoloFake}</span></p>
                            <p class="flex items-center justify-between"><strong class="text-gray-700 uppercase tracking-wider font-sans text-[11px]">Data Base:</strong> <span>${dataHoje}</span></p>
                        </div>
                        <div class="bg-brandDark rounded-2xl p-5 text-center shadow-md relative overflow-hidden z-10">
                             <div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_25%,rgba(255,255,255,0.05)_50%,transparent_75%,transparent_100%)] bg-[length:250%_250%,100%_100%] animate-[shimmer_3s_linear_infinite]"></div>
                            <p class="text-[14px] font-bold text-white tracking-wide flex items-center justify-center gap-2">
                                <i data-lucide="mail-check" class="w-5 h-5 text-emerald-400"></i>
                                Material enviado para seu e-mail.
                            </p>
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-400 font-medium mt-8">Pode fechar esta janela com segurança.</p>
                </div>
            `;
            lucide.createIcons();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const stepToLoad = urlParams.get('step');

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes progress-indet { 0% { left: -50%; } 100% { left: 100%; } }
            @keyframes scale-in { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
            @keyframes spin-slow { to { transform: rotate(360deg); } }
            @keyframes shimmer { 0% { background-position: -200% 0, 0 0; } 100% { background-position: 200% 0, 0 0; } }
        `;
        document.head.appendChild(style);

        if (stepToLoad === 'sucesso') {
            telaSucessoAbsoluto();
        } else if (stepToLoad && FUNIL[stepToLoad]) {
            telaCarregamentoIntermediaria(stepToLoad);
        } else {
             document.getElementById('app-content').classList.add('p-6');
            renderizarTela('erro_pagamento');
        }
    </script>
</body>
</html>
